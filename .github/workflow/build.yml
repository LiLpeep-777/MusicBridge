        cat << 'EOF' > app/src/main/java/com/bridge/music/BridgeService.kt
        package com.bridge.music
        
        import android.app.*
        import android.content.Intent
        import android.graphics.Bitmap
        import android.media.session.PlaybackState
        import android.service.notification.NotificationListenerService
        import android.service.notification.StatusBarNotification
        import android.support.v4.media.session.MediaSessionCompat
        import android.support.v4.media.session.PlaybackStateCompat
        import android.view.KeyEvent
        import androidx.core.app.NotificationCompat
        import androidx.media.app.NotificationCompat.MediaStyle

        class BridgeService : NotificationListenerService() {
            private lateinit var mediaSession: MediaSessionCompat

            override fun onCreate() {
                super.onCreate()
                mediaSession = MediaSessionCompat(this, "MusicBridge")
                mediaSession.isActive = true
                
                val channel = NotificationChannel("bridge_channel", "Media Bridge", NotificationManager.IMPORTANCE_LOW)
                getSystemService(NotificationManager::class.java).createNotificationChannel(channel)

                // Medya tuşlarına (Play/Pause/Next) basıldığında ne olacağını belirliyoruz
                mediaSession.setCallback(object : MediaSessionCompat.Callback() {
                    override fun onPlay() {
                        super.onPlay()
                        sendSpotifyCommand(KeyEvent.KEYCODE_MEDIA_PLAY)
                    }
                    override fun onPause() {
                        super.onPause()
                        sendSpotifyCommand(KeyEvent.KEYCODE_MEDIA_PAUSE)
                    }
                    override fun onSkipToNext() {
                        super.onSkipToNext()
                        sendSpotifyCommand(KeyEvent.KEYCODE_MEDIA_NEXT)
                    }
                    override fun onSkipToPrevious() {
                        super.onSkipToPrevious()
                        sendSpotifyCommand(KeyEvent.KEYCODE_MEDIA_PREVIOUS)
                    }
                })
            }

            // Spotify kapalı bile olsa onu arka planda zorla uyandıracak sinyal fonksiyonu
            private fun sendSpotifyCommand(keyCode: Int) {
                val downIntent = Intent(Intent.ACTION_MEDIA_BUTTON).apply {
                    setPackage("com.spotify.music")
                    putExtra(Intent.EXTRA_KEY_EVENT, KeyEvent(KeyEvent.ACTION_DOWN, keyCode))
                }
                sendOrderedBroadcast(downIntent, null)

                val upIntent = Intent(Intent.ACTION_MEDIA_BUTTON).apply {
                    setPackage("com.spotify.music")
                    putExtra(Intent.EXTRA_KEY_EVENT, KeyEvent(KeyEvent.ACTION_UP, keyCode))
                }
                sendOrderedBroadcast(upIntent, null)
            }

            override fun onNotificationPosted(sbn: StatusBarNotification) {
                if (sbn.packageName == "com.spotify.music") {
                    val extras = sbn.notification.extras
                    val title = extras.getString(Notification.EXTRA_TITLE) ?: "Spotify Müzik"
                    val artist = extras.getString(Notification.EXTRA_TEXT) ?: "Bilinmeyen"
                    val art = extras.getParcelable<Bitmap>(Notification.EXTRA_PICTURE)

                    mediaSession.setMetadata(
                        android.support.v4.media.MediaMetadataCompat.Builder()
                            .putString(android.support.v4.media.MediaMetadataCompat.METADATA_KEY_TITLE, title)
                            .putString(android.support.v4.media.MediaMetadataCompat.METADATA_KEY_ARTIST, artist)
                            .putBitmap(android.support.v4.media.MediaMetadataCompat.METADATA_KEY_ALBUM_ART, art)
                            .build()
                    )

                    mediaSession.setPlaybackState(
                        PlaybackStateCompat.Builder()
                            .setState(PlaybackStateCompat.STATE_PLAYING, PlaybackState.PLAYBACK_POSITION_UNKNOWN, 1.0f)
                            .setActions(PlaybackStateCompat.ACTION_PLAY_PAUSE or PlaybackStateCompat.ACTION_SKIP_TO_NEXT or PlaybackStateCompat.ACTION_SKIP_TO_PREVIOUS)
                            .build()
                    )

                    val builder = NotificationCompat.Builder(this, "bridge_channel")
                        .setSmallIcon(android.R.drawable.ic_media_play)
                        .setContentTitle(title)
                        .setContentText(artist)
                        .setLargeIcon(art)
                        .setStyle(MediaStyle().setMediaSession(mediaSession.sessionToken))
                        .setOngoing(true) // Kalıcı yapar

                    startForeground(1, builder.build())
                }
            }

            override fun onDestroy() {
                mediaSession.release()
                super.onDestroy()
            }
        }
        EOF
